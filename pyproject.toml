[project]
name = "batterytrader"
version = "0.1.0"
description = "A grid-scale battery trading GB power prices: rule, optimiser, forecast + optimiser and RL."
readme = "README.md"
authors = [
    { name = "ConnorLava42", email = "cjlavanaway@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "typer>=0.28.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.9.2",
]

[project.scripts]
batterytrader = "batterytrader.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["rl: needs the optional rl extra (stable-baselines3 and PyTorch)"]